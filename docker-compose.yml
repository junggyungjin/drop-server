version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: drop-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: drop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: drop-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
